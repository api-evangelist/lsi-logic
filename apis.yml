description: LSI Logic Corporation was an American semiconductor company known for
  application-specific integrated circuits (ASICs), custom system-on-chip designs,
  and storage/RAID controller silicon. It was surfaced as a portfolio company of Mayfield
  and added to the API Evangelist network as a stub. The company was acquired by Avago
  Technologies in 2014 and its assets are now part of Broadcom; its former lsi.com
  domain redirects to broadcom.com. LSI Logic operates no independent public developer
  API program.
